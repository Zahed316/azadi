name: Deploy
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: '3.90.0'
          command: deploy

  deploy-admin-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-admin-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-app/package-lock.json

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Typecheck admin-app
        working-directory: admin-app
        run: npm run typecheck

      - name: Lint admin-app
        working-directory: admin-app
        run: npm run lint

      - name: Format check admin-app
        working-directory: admin-app
        run: npm run format:check

      - name: Build admin-app
        working-directory: admin-app
        run: npm run build

      - name: Deploy admin-app to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: '3.90.0'
          command: pages deploy admin-app/dist --project-name=azadi-admin

  deploy-menu-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-menu-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: menu-app/package-lock.json

      - name: Install menu-app dependencies
        working-directory: menu-app
        run: npm ci

      - name: Typecheck menu-app
        working-directory: menu-app
        run: npm run typecheck

      - name: Lint menu-app
        working-directory: menu-app
        run: npm run lint

      - name: Format check menu-app
        working-directory: menu-app
        run: npm run format:check

      - name: Build menu-app
        working-directory: menu-app
        run: npm run build

      - name: Deploy menu-app to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: '3.90.0'
          command: pages deploy menu-app/dist --project-name=azadi-menu
