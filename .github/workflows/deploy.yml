name: Deploy
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy

  deploy-admin-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-admin-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-app/package-lock.json

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Typecheck admin-app
        working-directory: admin-app
        run: npm run typecheck

      - name: Lint admin-app (non-blocking)
        working-directory: admin-app
        run: npm run lint
        continue-on-error: true

      - name: Format check admin-app
        working-directory: admin-app
        run: npm run format:check

      - name: Build admin-app
        working-directory: admin-app
        run: npm run build

      - name: Deploy admin-app to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy admin-app/dist --project-name=azadi-admin

  deploy-menu-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-menu-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: menu-app/package-lock.json

      - name: Install menu-app dependencies
        working-directory: menu-app
        run: npm ci

      - name: Typecheck menu-app
        working-directory: menu-app
        run: npm run typecheck

      - name: Lint menu-app (non-blocking)
        working-directory: menu-app
        run: npm run lint
        continue-on-error: true

      - name: Format check menu-app
        working-directory: menu-app
        run: npm run format:check

      - name: Build menu-app
        working-directory: menu-app
        run: npm run build

      - name: Deploy menu-app to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy menu-app/dist --project-name=azadi-menu
