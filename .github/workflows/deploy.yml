name: Deploy
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint (non-blocking, first iteration)
        # Phase 4.3: lint is added as a non-blocking step. Once the existing
        # warning baseline is fixed in follow-up PRs, drop continue-on-error
        # to make this a hard gate.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy

  deploy-admin-app:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-admin-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-app/package-lock.json

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Typecheck admin-app
        working-directory: admin-app
        run: npm run typecheck

      - name: Lint admin-app (non-blocking, first iteration)
        working-directory: admin-app
        continue-on-error: true
        run: npm run lint

      - name: Build admin-app
        working-directory: admin-app
        run: npm run build

      - name: Deploy admin-app to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy admin-app/dist --project-name=azadi-admin
